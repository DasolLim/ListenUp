[project]
name = "listenup-backend"
version = "0.1.0"
description = "ListenUp FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Few-shot LLM prompts are long, line-continued string literals tuned for the
# model — reflowing them would change the prompt text sent to the API.
"services/openrouter/real.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
