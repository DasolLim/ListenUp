# Render blueprint for the ListenUp backend.
#
# The backend lives here rather than on Vercel because `/ws/transcribe` is a
# persistent inbound WebSocket, which Vercel Functions cannot host. Render's
# free instance does support them.
#
# This blueprint deploys the MOCK image (backend/Dockerfile.slim): captions
# replay a fixture conversation and translations are canned. That is what makes
# it free and what makes it fit 512 MB. Nothing here reaches a paid provider,
# so no API key is needed and no session is billed.
#
# Deliberately NOT set: APP_ENV. `app/preflight.py` refuses to boot when
# APP_ENV=production and any provider is on a mock — a guard against a deploy
# that looks healthy while serving fixture transcripts to real users. This
# deploy *is* on mocks on purpose, so it must not claim to be production.
services:
  - type: web
    name: listenup-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.slim
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Every provider on its mock. Each of these is also the code's default;
      # they are written out because a deploy's configuration should be
      # readable here rather than inferred from four factory functions.
      - key: TRANSCRIPTION_SERVICE
        value: mock
      - key: TRANSLATION_SERVICE
        value: mock
      - key: ENHANCED_TRANSLATION_SERVICE
        value: mock
      - key: GENZ_EXPLAINER_SERVICE
        value: mock
      # The browser tier is free and genuine, not a stand-in: voices are
      # rendered by the visitor's own device via speechSynthesis.
      - key: TTS_SERVICE
        value: browser
      # CORS. Without this app/cors.py falls back to http://localhost:3000 and
      # every request from the deployed site fails preflight — which the
      # browser reports as a frontend bug, so it is worth getting right once.
      - key: FRONTEND_ORIGIN
        value: https://listenup-seven.vercel.app
      # Required whatever the providers are (app/preflight.py REQUIRED).
      # sync: false means Render prompts for the value instead of storing it
      # in this file, which is committed to git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
